site_name: LAMULA-DRx
site_description: Receptor digital FPGA del sistema LAMULA — implementación y validación sobre ZedBoard, con portabilidad a Zynq UltraScale+ ZU9
repo_url: https://github.com/vladimir1284/lamula-drx
repo_name: vladimir1284/lamula-drx

theme:
  name: material
  language: es
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: deep purple
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Inicio: index.md
  - Alcance:
      - Contexto: alcance/contexto.md
      - Decisiones congeladas: alcance/decisiones.md
      - Pendientes y hallazgos abiertos: alcance/pendientes.md
      - ADR-001 · fs, R₁ y R₂ (propuesta): alcance/adr-001-fs-r1-r2.md
  - Plataforma:
      - Frontera y cobertura: plataforma/zedboard.md
      - Dilatación temporal (FS_HZ): plataforma/dilatacion-temporal.md
      - Fuente de muestras (SSA): plataforma/fuente-de-muestras.md
      - Presupuesto de recursos: plataforma/recursos.md
  - Tutorial:
      - Cómo leer esto: tutorial/index.md
      - 1 · El paquete de parámetros: tutorial/01-parametros.md
      - 2 · Aritmética de punto fijo: tutorial/02-punto-fijo.md
      - 3 · La cadena DDC: tutorial/03-ddc.md
      - 4 · Simulación: tutorial/04-simulacion.md
      - 5 · El contrato DRx↔DSP: tutorial/05-contrato.md
      - 6 · Gateware: tutorial/06-gateware.md
      - 7 · Resultados: tutorial/07-resultados.md
  - Implementación:
      - Fases Z0–Z5: implementacion/fases.md
      - Estructura del repositorio: implementacion/estructura-repo.md
      - Substrato Z0 (qué existe y cómo se corre): implementacion/substrato.md
      - Mapa de registros AXI-Lite (v1, Z1): implementacion/registros.md
      - ILA de depuración (P-21): implementacion/ila.md
      - Evidencia de P-21 (tres corridas): implementacion/evidencia/p-21/resumen.md
      - Infraestructura: implementacion/infraestructura.md
      - Provisionado de placa limpia (borrador): implementacion/provisionado.md
  - Firmware y Subsistema PS/PL:
      - Visión General del Firmware: firmware/index.md
      - Plataforma Hardware/Software: firmware/plataforma-hw-sw.md
      - Diseño de la PL y Block Design: firmware/diseno-pl.md
      - Interfaz Hardware/Software y Mapa de Registros: firmware/mapa-registros.md
      - Secuencia de Arranque e Inicialización: firmware/arranque.md
      - Arquitectura de Tareas FreeRTOS: firmware/tareas-freertos.md
      - Comunicación y Sincronización entre Tareas: firmware/comunicacion-sincronizacion.md
      - Rutinas de Interrupción (ISR) y GIC: firmware/interrupciones.md
      - Módulos y Drivers de Firmware: firmware/modulos-drivers.md
      - Configuración de FreeRTOS y BSP: firmware/configuracion-freertos.md
      - Cómo Compilar, Cargar y Depurar: firmware/compilacion-depuracion.md
      - Guía para Añadir una Tarea o Periférico Nuevo: firmware/guia-extension.md
      - Glosario de Firmware y RTOS: firmware/glosario.md
  - Documentación de IPs:
      - Visión General y Flujo de Datos: ip/index.md
      - IP Fuente de Muestras SSA (vector_source): ip/vector_source.md
      - IP Cadena DDC (drx_ddc): ip/drx_ddc.md
      - IP Motor de Timing y Triggers (drx_timing_engine): ip/drx_timing_engine.md
      - IP Range Gate y Ping-Pong (drx_range_gate): ip/drx_range_gate.md
      - IP Empaquetador de Rayos (drx_ray_packer): ip/drx_ray_packer.md
      - IP Mapa de Registros AXI-Lite (drx_axil_regs): ip/drx_axil_regs.md
      - IP Unidades Aritméticas (round & saturate): ip/drx_round_saturate.md
  - Verificación:
      - Plan de testing: pruebas/plan-testing.md
      - Modelo dorado (oráculo): pruebas/modelo-dorado.md
      - Campaña de Z5 (borrador): pruebas/campana-z5.md
  - Portabilidad:
      - Registro delta ZedBoard → ZU9: portabilidad/registro-delta.md
      - Dossier de migración ZU9: portabilidad/dossier-migracion.md
  - Referencia:
      - Plan ZedBoard (documento original): referencia/plan-zedboard.md
      - Project Plan ZU9 (34 semanas): referencia/project-plan-zu9.md
