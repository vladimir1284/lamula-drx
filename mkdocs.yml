site_name: LAMULA-DRx
site_description: Receptor digital FPGA del sistema LAMULA — implementación y validación sobre ZedBoard, con portabilidad a Zynq UltraScale+ ZU9
repo_url: https://github.com/vladimir1284/lamula-drx
repo_name: vladimir1284/lamula-drx

theme:
  name: material
  language: es
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: deep purple
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Inicio: index.md
  - Alcance:
      - Contexto: alcance/contexto.md
      - Decisiones congeladas: alcance/decisiones.md
      - Pendientes y hallazgos abiertos: alcance/pendientes.md
  - Plataforma:
      - Frontera y cobertura: plataforma/zedboard.md
      - Dilatación temporal (FS_HZ): plataforma/dilatacion-temporal.md
      - Fuente de muestras (SSA): plataforma/fuente-de-muestras.md
      - Presupuesto de recursos: plataforma/recursos.md
  - Tutorial:
      - Cómo leer esto: tutorial/index.md
      - 1 · El paquete de parámetros: tutorial/01-parametros.md
      - 2 · Aritmética de punto fijo: tutorial/02-punto-fijo.md
      - 3 · La cadena DDC: tutorial/03-ddc.md
      - 4 · Simulación: tutorial/04-simulacion.md
      - 5 · El contrato DRx↔DSP: tutorial/05-contrato.md
      - 6 · Gateware: tutorial/06-gateware.md
      - 7 · Resultados: tutorial/07-resultados.md
  - Implementación:
      - Fases Z0–Z5: implementacion/fases.md
      - Estructura del repositorio: implementacion/estructura-repo.md
      - Substrato Z0 (qué existe y cómo se corre): implementacion/substrato.md
      - Infraestructura: implementacion/infraestructura.md
  - Verificación:
      - Plan de testing: pruebas/plan-testing.md
      - Modelo dorado (oráculo): pruebas/modelo-dorado.md
  - Portabilidad:
      - Registro delta ZedBoard → ZU9: portabilidad/registro-delta.md
  - Referencia:
      - Plan ZedBoard (documento original): referencia/plan-zedboard.md
      - Project Plan ZU9 (34 semanas): referencia/project-plan-zu9.md
