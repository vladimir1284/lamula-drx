# LAMULA DRx — mapa de registros AXI-Lite de `drx_top`.
#
# Fuente única de verdad de este mapa, mismo patrón que `contract/schema/*.toml`:
# `tools/gen_registers.py` genera `rtl/generated/drx_regs_pkg.sv` y
# `fw/include/drx_regs.h` a partir de este fichero. Ninguno de los dos se edita
# a mano — regenerar con `python3 tools/gen_registers.py` tras cualquier cambio
# aquí; el CI falla si no coinciden (`--check`).
#
# v1 (19-sep-2026) congeló CTRL/STATUS/VERSION sin el overflow de saturación
# del DDC a propósito (exponerlo exigía tocar los puertos de
# drx_ddc_top.sv/drx_ddc_quad_top.sv, ya verificados bit-exacto bajo D-12,
# y el costo de rehacer esa matriz no se justificaba para el primer corte).
# v2 (misma sesión, más tarde) añade OVERFLOW ya con esos puertos añadidos.
# La matriz L1 de 16 corridas contra xsim real (tb_l1_ddc.sv, D-12) se
# reconfirmó tras el cambio de puertos: 16/16 PASS, 20-sep-2026 — ver
# docs/implementacion/registros.md.
#
# v3 (22-sep-2026) añade el mapa de Z2: TIMING_CTRL/TIMING_STATUS y la
# configuración de `drx_timing_engine.sv` (D-13, 2 lotes de PRF/ancho de
# pulso por radial + N_TRIGGERS de retardo/ancho). Esto es exactamente la
# "condición de cierre" que P-15 fijaba para el lado del registro -- ver
# docs/alcance/pendientes.md#p-15 -- pero NO toca el contrato DRx<->DSP
# congelado (D-08): este mapa es interno (firmware<->fabric), el contrato es
# la interfaz externa (DRx<->DSP), y P-15 sigue abierto del lado del
# contrato a propósito, pendiente de discutirlo (bump de version_minor +
# actualizar tests, alcance de Z4). addr_width sube de 6 a 7 porque las 18
# palabras que hacen falta ya no caben en 16.
#
# v4 (22-sep-2026, más tarde) usa 2 de los bits que v3 dejaba reservados de
# TIMING_STATUS (antes "leen 0" documentado sin más) para los checks
# AUTOCONTENIDOS de D-09 (rtl/drx_timing_config_valid.sv, instanciado x2
# dentro de drx_timing_engine.sv): pulse_width fuera de la tabla de
# config/params.toml o que no cabe en su propio PRI. NO implementaba D-09
# completo todavía -- PRF x rango no se validaba en RTL (ver v5, más abajo).
# Redefinir bits que v3 documentaba como "siempre 0" es un cambio de
# semántica del mapa, no solo de RTL interno, de ahí el bump.
#
# v5 (25-sep-2026) añade BINS_LOW/BINS_HIGH: el conteo de bins de range-gate
# por lote (D-15) deja de ser la elección fino/grueso fija de
# config/params.toml (BINS_MODE_FINE/COARSE) y pasa a ser un registro por
# lote, configurable en runtime -- viene de DSP, que a su vez lo recibe de
# RCP según el VCP (la proporción entre el rango del lote bajo y el del alto
# nunca es la misma). `mode_coarse` (bit 0 de CTRL) deja de llegar a
# drx_range_gate -- sigue existiendo, pero solo para drx_ddc_quad_top
# (decimación). El mismo cambio cierra del todo D-09: TIMING_STATUS bits 1/2
# ya reflejan también un `bins` fuera del techo físico de BRAM (ver
# docs/implementacion/registros.md#z2-en-v5), sin bit nuevo -- el mismo
# `valid` por lote de drx_timing_config_valid.sv ya incluía ese cuarto check.
#
# v6 (25-sep-2026, más tarde) añade GATE_TRUNCATED: el BITE de tiempo muerto
# que D-14 dejaba explícitamente abierto ("no hay hoy ningún contador ni bit
# que distinga un tiempo muerto normal de un ray_start que llegó tarde y
# truncó un rayo en curso"). Bit c es el `ray_truncated` sticky del canal c de
# drx_range_gate_quad_top -- mismo patrón W1C que STATUS, registro propio (no
# bits nuevos de STATUS/TIMING_STATUS) porque es un diagnóstico distinto con
# su propia fuente y su propio clear en RTL (`clear_truncated`, no comparte
# `clear` con `overrun`).
#
# v7 (26-sep-2026, Z4.1) añade TRIG_COUNT: contador libre de 32 bits que
# incrementa una vez por cada pulso de `pulse_trig` de drx_timing_engine (el
# mismo pulso que ya dispara `ray_start` en drx_range_gate_quad_top, D-14) --
# el "contador de trigger" que fases.md#z4 ya listaba como parte de los
# metadatos que el firmware de ensamblado de rayos (Z4.4) tiene que adjuntar a
# cada rayo. Solo lectura, sin write-1-to-clear: es un contador monótono desde
# reset, no un diagnóstico sticky -- envuelve en 2^32 pulsos, muy por encima
# de cualquier sesión real. `mode_coarse`/BINS_*/etc no cambian de semántica;
# este registro es puramente aditivo.
# v8 (1-oct-2026, Z4.3) usa el bit 1 de CTRL, que v1..v7 documentaban como
# reservado y "lee 0": `vector_source_ddr`, el selector entre los dos modos de
# fuente de muestras de docs/plataforma/fuente-de-muestras.md -- BRAM-loop (0,
# valor de reset, el de siempre) y Throttled(DDR) (1, muestras desde la DDR del
# PS por AXI DMA MM2S). Mismo criterio de bump que v4: redefinir un bit que el
# mapa declaraba como siempre 0 es un cambio de semantica visible desde
# firmware, no solo de RTL interno. Sin registro nuevo porque no hace falta: es
# un unico bit de modo, del mismo tipo que `mode_coarse` y con la misma regla
# (solo seguro de cambiar con la cadena parada).
# v9 (2-oct-2026, Z4.5) anade NCO_PINC: la palabra de incremento de fase del
# NCO, escribible en tiempo de ejecucion. Es la pieza de hardware que faltaba
# para la actuacion AFC -- hasta v8 el incremento vivia congelado en la
# personalizacion de la IP del DDS Compiler (`Phase_Increment {Fixed}`) y NO
# habia ningun puerto por el que cambiarlo; la IP se regenero con
# `{Programmable}` (ver tcl/gen_ip.tcl) y este registro es su unico escritor.
# Lectura/escritura, valor de reset = NCO_PHASE_INC (el mismo PINC1 de la IP),
# asi que un sistema que nunca escriba aqui se comporta exactamente como v8 --
# condicion necesaria para que la matriz de 16 corridas de D-12 siga siendo el
# oraculo del camino sin AFC.
# v10 (3-oct-2026, P-16) anade el bit 1 de TIMING_CTRL, que v3..v9
# documentaban como reservado y "lee 0": `timing_paced`. Con 0 (valor de
# reset) el motor de timing cuenta CICLOS DE RELOJ, como siempre; con 1
# cuenta AVANCES DE MUESTRA (`drx_sample_pacer.sv`). Son lo mismo mientras la
# fuente entregue una muestra por ciclo, y dejan de serlo en Throttled(DDR),
# donde `vector_source` junta N_CH beats por conjunto: ahi el rayo tarda ~N_CH
# veces el PRI en llenarse, `ray_start` lo trunca y no se completa ninguno
# (P-16). Mismo criterio de bump que v4 y v8: redefinir un bit que el mapa
# declaraba como siempre 0 es un cambio de semantica visible desde firmware.
# El bit NO se deriva de `vector_source_ddr` a proposito -- poder pacear sin
# DDR, o correr DDR sin pacear, es lo que distingue un fallo del pacer de un
# fallo del modo.
# v11 (4-oct-2026) RETIRA el modo Throttled(DDR) y hace el bucle de BRAM
# cargable en tiempo de ejecucion. El bit 1 de CTRL (`vector_source_ddr` de v8)
# vuelve a ser reservado y a leer 0: el canal MM2S del AXI DMA sale del block
# design y `rtl/vector_source.sv` pierde su mitad de DDR, asi que ya no hay dos
# modos entre los que elegir. No se reutiliza el bit para otra cosa a proposito
# -- un firmware de v8..v10 que lo escriba no debe activar algo distinto en
# silencio. El bit 2, `vector_load`, es el que gobierna la carga: congela el
# lector de BRAM mientras el PS escribe y, al soltarlo, deja el puntero en la
# muestra 0.
# Registros nuevos VEC_ADDR/VEC_DATA/VEC_LEN: la ventana por la que el PS
# escribe la BRAM. No es una ventana de memoria direccionable porque no cabe --
# addr_width = 7 son 128 B en total-- y un axi_bram_ctrl habria pedido un
# maestro mas en el axi_interconnect y un segmento nuevo en el mapa de
# direcciones. A cambio, una carga de 4000 muestras son 4000 escrituras de
# VEC_DATA con autoincremento, del orden de 1 ms, y ocurre una vez por
# seleccion de vector.
# Motivo del cambio: P-16. El DDS Compiler no tiene `aclken`, asi que avanza un
# paso de fase por ciclo de reloj mire o no `valid`; con Throttled(DDR)
# entregando una muestra cada N_CH ciclos el DDC mezclaba a ~N_CH veces el IF y
# la salida caia al suelo de ruido (-87,3 dBFS medidos contra -9,02 del modelo,
# 3-oct-2026). Con el estimulo saliendo de BRAM a una muestra por ciclo las dos
# bases de tiempo vuelven a coincidir. Esto NO arregla la causa raiz, que sigue
# en el diseno para cualquier fuente con huecos futura.
schema_version = 11

# Bytes direccionables: 2^addr_width = 128 B = 32 palabras de 32 bits. Las
# primeras 26 palabras (0x00-0x64) están implementadas (Z1 + Z2 v3/v5/v6 +
# Z4.1 v7 + Z4.5 v9 + v11); el resto (0x68 en adelante) queda reservado sin
# implementar (lee 0, escritura sin efecto), sin diseñarlo ahora.
addr_width = 7

[[register]]
name = "version"
offset = 0x00
access = "ro"
doc = "Versión de ESTE mapa de registros (= schema_version de arriba). Permite a firmware confirmar que habla con el mapa que espera antes de tocar CTRL/STATUS."

[[register]]
name = "ctrl"
offset = 0x04
access = "rw"
doc = "Bit 0: mode_coarse (0 = fino, valor de reset; 1 = grueso), compartido por los N_CH canales de drx_ddc_quad_top (decimación), igual que ya lo era como localparam. Desde v5 (D-15) ya NO llega a drx_range_gate -- el conteo de bins de range-gate es BINS_LOW/BINS_HIGH, no una elección fino/grueso fija. Bit 1: RESERVADO desde v11, lee 0 y una escritura ahí no tiene efecto -- fue vector_source_ddr entre v8 y v10, y el modo Throttled(DDR) que seleccionaba ya no existe (el canal MM2S salió del block design). No se reutiliza para otra cosa, para que un firmware de v8..v10 que lo escriba no active algo distinto en silencio. Bit 2 (v11): vector_load -- 0 = reproduciendo (valor de reset); 1 = carga en curso, el lector de BRAM de vector_source se congela y el PS puede escribir por VEC_ADDR/VEC_DATA sin que el consumidor lea una mezcla del vector viejo y el nuevo. Al bajar de 1 a 0 el puntero de lectura queda en la muestra 0, así que la reproducción siempre empieza en un punto conocido. Bits 31:3 reservados: leen 0, una escritura ahí no tiene efecto."

[[register]]
name = "status"
offset = 0x08
access = "w1c"
doc = "Bit c: overrun sticky del canal c de range-gate (drx_range_gate_quad_top.overrun). Escribir 1 en el bit c lo limpia en origen (nuevo puerto `clear` de drx_range_gate); si hay un overrun genuino el mismo ciclo que el clear, el set gana y el bit queda en 1. Bits >= N_CH leen 0."

[[register]]
name = "overflow"
offset = 0x0C
access = "w1c"
doc = "Bit c: overflow sticky de la saturación final del DDC del canal c (drx_ddc_quad_top.overflow, combinación de las ramas I/Q de drx_ddc_top). A diferencia de STATUS, el latch sticky vive AQUÍ, dentro de drx_axil_regs, no en drx_ddc_top: la fuente (drx_saturate) es deliberadamente combinacional, sin estado, y añadir un latch dentro de un núcleo ya verificado bit a bit (D-12) habría sido tocar más de lo necesario para un registro de solo lectura. Escribir 1 en el bit c lo limpia; si hay un overflow genuino el mismo ciclo que el clear, el set gana. Bits >= N_CH leen 0."

# --- Z2 (D-13): motor de timing -- ver rtl/drx_timing_engine.sv --------------

[[register]]
name = "timing_ctrl"
offset = 0x10
access = "rw"
doc = "Bit 0: enable de drx_prf_batch_seq (arranca/detiene el secuenciador de 2 lotes). Valor de reset: 0 (detenido). Bit 1 (v10): timing_paced -- 0 = el motor cuenta ciclos de reloj (valor de reset, el comportamiento de v3..v9); 1 = cuenta avances de muestra, o sea los ciclos en que la fuente entrega un conjunto de N_CH muestras y el DDC lo toma (drx_sample_pacer.sv). Son lo mismo mientras la fuente vaya a una muestra por ciclo; en Throttled(DDR) no lo son y sin esto no se completa ningún rayo (P-16). No lo cambies con el secuenciador corriendo: cambia el significado de prf_div a mitad de radial. Bits 31:2 reservados: leen 0, una escritura ahí no tiene efecto."

[[register]]
name = "timing_status"
offset = 0x14
access = "w1c"
doc = "Bit 0: radial_done sticky de drx_prf_batch_seq (se puso en 1 al menos una vez desde el último clear -- un radial completo, lote bajo + lote alto). Bit 1: config_invalid del lote bajo (D-09 completo desde v5: pulse_width fuera de tabla, no cabe en su propio PRI, prf_div bajo el piso de rango no ambiguo, o bins sobre el techo físico de BRAM -- D-15) -- mientras esté en 1, drx_timing_engine mantiene el secuenciador de lotes sin correr (equivalente a enable=0), sin importar TIMING_CTRL. Bit 2: mismo check para el lote alto. Los tres bits comparten el mismo patrón set-sobre-clear-concurrente que STATUS/OVERFLOW. Bits 31:3 reservados: leen 0."

[[register]]
name = "prf_div_low"
offset = 0x18
access = "rw"
doc = "prf_div del lote bajo (vigilancia/PRF baja) de drx_prf_batch_seq, ciclos de FS_HZ por PRI. Validado en RTL desde v5 (D-09 completo, drx_timing_config_valid.sv): junto con pulse_width, si el pulso no cabe en su propio PRI, o si prf_div da un rango no ambiguo por debajo de 460 km (piso fijo, ver config/params.toml), el lote queda inválido (TIMING_STATUS bit 1/2) y el secuenciador no corre."

[[register]]
name = "prf_div_high"
offset = 0x1C
access = "rw"
doc = "prf_div del lote alto (Doppler/PRF alta) de drx_prf_batch_seq. Mismas condiciones que prf_div_low, con el piso de rango del lote alto (115 km) en vez del del lote bajo."

[[register]]
name = "pulse_width"
offset = 0x20
access = "rw"
doc = "Bits 15:0: pulse_width_cycles del lote bajo. Bits 31:16: pulse_width_cycles del lote alto. Empaquetados juntos (cada uno cabe en 16 bits, PulseWidthBits de drx_prf_batch_seq.sv) para no gastar dos palabras completas en un valor que nunca necesita 32 bits. Validado en RTL desde v4 (D-09): tiene que estar en la tabla de config/params.toml Y caber en el prf_div de su propio lote, o el lote queda inválido -- ver timing_status."

[[register]]
name = "n_pulses"
offset = 0x24
access = "rw"
doc = "Bits 15:0: n_pulses del lote bajo (pulsos antes de pasar al lote alto). Bits 31:16: n_pulses del lote alto (pulsos antes de radial_done y volver al lote bajo). Mismo empaquetado que PULSE_WIDTH."

[[register]]
name = "trig_delay_0"
offset = 0x28
access = "rw"
doc = "Retardo (ciclos de FS_HZ desde `pulse_trig`) del canal 0 de drx_trigger_gen. 32 bits completos, igual que el puerto delay[] de ese módulo."

[[register]]
name = "trig_delay_1"
offset = 0x2C
access = "rw"
doc = "Retardo del canal 1 de drx_trigger_gen. Mismas condiciones que TRIG_DELAY_0."

[[register]]
name = "trig_delay_2"
offset = 0x30
access = "rw"
doc = "Retardo del canal 2 de drx_trigger_gen. Mismas condiciones que TRIG_DELAY_0."

[[register]]
name = "trig_delay_3"
offset = 0x34
access = "rw"
doc = "Retardo del canal 3 de drx_trigger_gen. Mismas condiciones que TRIG_DELAY_0."

[[register]]
name = "trig_width_0"
offset = 0x38
access = "rw"
doc = "Ancho (ciclos de FS_HZ) del pulso del canal 0 de drx_trigger_gen. Tiene que ser >= 1 -- drx_trigger_one_shot.sv asume esto y no lo valida en RTL, ver su cabecera."

[[register]]
name = "trig_width_1"
offset = 0x3C
access = "rw"
doc = "Ancho del canal 1 de drx_trigger_gen. Mismas condiciones que TRIG_WIDTH_0."

[[register]]
name = "trig_width_2"
offset = 0x40
access = "rw"
doc = "Ancho del canal 2 de drx_trigger_gen. Mismas condiciones que TRIG_WIDTH_0."

[[register]]
name = "trig_width_3"
offset = 0x44
access = "rw"
doc = "Ancho del canal 3 de drx_trigger_gen. Mismas condiciones que TRIG_WIDTH_0."

# --- Z2 (D-15, v5): conteo de bins de range-gate por lote --------------------

[[register]]
name = "bins_low"
offset = 0x48
access = "rw"
doc = "Conteo de bins de range-gate del lote bajo (D-15, v5): cuántas muestras decimadas entran en un rayo de este lote. Configurable en runtime -- viene de DSP, que a su vez lo recibe de RCP según el VCP (Batch mode de NEXRAD: el lote de vigilancia necesita ver más lejos que el de Doppler, D-13). Validado en RTL desde v5: tiene que ser >= 1 y no superar BINS_MODE_FINE (3689, la profundidad física real de la BRAM de drx_range_gate) o el lote queda inválido -- ver timing_status y drx_timing_config_valid.sv. `mode_coarse` (CTRL bit 0) ya NO decide esto -- ver ctrl."

[[register]]
name = "bins_high"
offset = 0x4C
access = "rw"
doc = "Conteo de bins de range-gate del lote alto (Doppler). Mismas condiciones que bins_low."

[[register]]
name = "gate_truncated"
offset = 0x50
access = "w1c"
doc = "Bit c: ray_truncated sticky del canal c de range-gate (drx_range_gate_quad_top.ray_truncated) -- BITE de D-14 (v6): se pone en 1 cuando un ray_start (D-14) llega con el puntero de escritura del canal c a mitad de rayo (tiempo muerto acumulado, o un PRI configurado más corto que bin_count) y descarta ese banco en curso sin emitirlo. Un ray_start que coincide con el wrap natural (el banco se completa por cuenta propia ese mismo ciclo) NO lo activa -- eso es operación normal, no un fallo. Mismo patrón W1C que status: escribir 1 en el bit c pulsa clear_truncated hacia el canal c de drx_range_gate; un truncamiento genuino el mismo ciclo que el clear gana. Registro propio, no bits nuevos de status/timing_status: es un diagnóstico distinto, con su propia fuente en RTL y su propio clear (no comparte clear con overrun). Bits >= N_CH leen 0."

# --- Z4.1 (26-sep-2026): contador de trigger, metadato de rayo --------------

[[register]]
name = "trig_count"
offset = 0x54
access = "ro"
doc = "Contador libre de 32 bits: incrementa una vez por cada pulso de pulse_trig de drx_timing_engine (el mismo pulso que ya dispara ray_start en drx_range_gate_quad_top, D-14). No es sticky ni write-1-to-clear -- es un conteo monótono desde el último reset, el 'contador de trigger' que fases.md#z4 ya listaba como metadato de rayo para el firmware de ensamblado (Z4.4). Envuelve en 2^32 pulsos."

[[register]]
name = "nco_pinc"
offset = 0x58
access = "rw"
doc = "Palabra de incremento de fase del NCO (NCO_PHASE_BITS = 32 bits), compartida por los N_CH canales de drx_ddc_quad_top: los N_CH ven el mismo IF, un retune que moviera solo uno los dejaria desalineados. Valor de reset = NCO_PHASE_INC, el mismo PINC1 que la IP del DDS Compiler lleva congelado como valor inicial, de modo que no escribir aqui deja la cadena bit a bit como antes de v9. CADA escritura genera un pulso de un ciclo hacia el canal S_AXIS_CONFIG del core (sin TREADY: se acepta siempre), incluso si el valor no cambia -- es la via de actuacion del mensaje `afc` del contrato DRx<->DSP. No hay continuidad de fase garantizada en el salto: el acumulador sigue desde donde estaba con el incremento nuevo, igual que `mode_coarse`, y por el mismo motivo (la correccion se aplica entre rayos, nunca dentro de uno; ver `apply_at_seq` del mensaje `afc`)."

# --- v11 (4-oct-2026): ventana de carga del vector de estimulo --------------
#
# Las tres juntas son el camino por el que el PS escribe los bancos de BRAM de
# `rtl/vector_source.sv` en tiempo de ejecucion, y sustituyen entero al camino
# DDR -> AXI DMA MM2S -> AXI4-Stream que v8 habia construido para lo mismo.

[[register]]
name = "vec_addr"
offset = 0x5C
access = "rw"
doc = "Puntero y banco de la ventana de carga del vector de estímulo. Bits 12:0: dirección de escritura dentro del banco, en muestras, de 0 a VECTOR_BRAM_DEPTH-1; AUTOINCREMENTA en 1 después de cada escritura de VEC_DATA, de modo que cargar un vector entero es escribir este registro una vez y VEC_DATA tantas veces como muestras tenga. Bits 18:16: banco de destino -- 0..N_CH-1 escribe solo ese canal, y 7 es difusión a los N_CH a la vez. La difusión es lo que hace que una carga cueste una pasada y no N_CH; los bancos siguen siendo independientes en RTL, así que un estímulo distinto por canal (Config A: Tx + H + V) es escribir tres veces, no un cambio de diseño. Un banco entre N_CH y 6 no escribe en ninguno. Bits 15:13 y 31:19 reservados: leen 0. El autoincremento envuelve dentro de los 13 bits y NO para al llegar a VECTOR_BRAM_DEPTH."

[[register]]
name = "vec_data"
offset = 0x60
access = "rw"
doc = "Una muestra de 16 bits con signo, en los bits 15:0 (bits 31:16 ignorados en escritura). Escribir aquí graba la muestra en el banco y la dirección que VEC_ADDR tenga en ese momento, y después incrementa VEC_ADDR[12:0]. La escritura solo llega a la BRAM con CTRL bit 2 (vector_load) en 1: con el lector corriendo, escribir aquí no tiene efecto, para que no se pueda corromper el vector que esta sonando. LEER este registro devuelve la última palabra escrita, NO el contenido de la BRAM: la memoria no tiene camino de lectura hacia AXI-Lite y añadirlo costaría un puerto más por banco sin comprar nada -- quien quiera verificar una carga, que mida el espectro del rayo, que es la prueba que de verdad importa."

[[register]]
name = "vec_len"
offset = 0x64
access = "rw"
doc = "Bits 12:0: longitud del bucle en muestras. El puntero de lectura de vector_source envuelve en VEC_LEN-1, no en la profundidad física del banco: VECTOR_BRAM_DEPTH (8192) es capacidad, esto es lo que se reproduce. Valor de reset = VECTOR_LOOP_LEN (4000), que es exactamente la longitud del tono que $readmemh precarga en el bitstream, así que un sistema que nunca escriba aquí reproduce el mismo bucle que v10 y antes. Una longitud que no sea múltiplo de IF_NORM_DEN deja un salto de fase en cada vuelta: el hardware la acepta, el gate de tools/gen_params.py solo cubre el valor de reset, y comprobarlo para un vector cargado en caliente es responsabilidad de quien lo carga. El valor 0 se trata como 1 (un bucle de una muestra), no como 'parado': parar es CTRL bit 2. Bits 31:13 reservados: leen 0."
